
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueMitra</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef3f9;color:#172033}
.container{max-width:850px;margin:20px auto;padding:12px}
.card{background:white;border-radius:24px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.header{text-align:center;margin-bottom:18px}
.logo{font-size:34px;font-weight:800;color:#2563eb}
.subtitle{color:#64748b;margin-top:5px}
.chat{min-height:350px;max-height:550px;overflow-y:auto;background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:15px}
.msg{padding:13px 16px;border-radius:17px;margin:10px 0;max-width:95%;line-height:1.6;white-space:pre-wrap}
.bot{background:#e3edff;color:#173b82}
.user{background:#2563eb;color:white;margin-left:auto}
.service-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0 18px}
.service-card{background:white;border:2px solid #dbeafe;border-radius:17px;padding:18px 10px;cursor:pointer;text-align:center;color:#1e293b;min-height:115px}
.service-card:hover{background:#eff6ff;border-color:#2563eb}
.service-icon{font-size:38px;display:block;margin-bottom:8px}
.service-name{font-size:17px;font-weight:bold}
.controls{display:flex;gap:10px;margin-top:15px}
input{flex:1;min-width:0;padding:15px;border:1px solid #cbd5e1;border-radius:14px;font-size:17px}
button{border:0;border-radius:14px;padding:14px 18px;cursor:pointer;font-size:16px;font-weight:600}
.primary{background:#2563eb;color:white}
.voice{background:#7c3aed;color:white;font-size:20px;min-width:65px}
.choice{display:flex;gap:10px;margin:10px 0}
.choice button{flex:1}
.hidden{display:none!important}
.lang-grid{display:grid;gap:12px}
.lang-button{padding:18px;background:#eff6ff;color:#1e40af;border:2px solid #dbeafe;font-size:20px}
.token-card{background:white;border:2px solid #dbeafe;border-radius:20px;padding:25px;text-align:center;margin-top:20px}
.token-number{font-size:65px;color:#2563eb;font-weight:800;margin:15px}
.token-info{text-align:left;line-height:2;border-top:1px dashed #cbd5e1;padding-top:15px;margin-top:15px}
.download{background:#16a34a;color:white;width:100%;margin-top:15px}
.restart{background:#e2e8f0;color:#334155;width:100%;margin-top:10px}
@media(max-width:550px){
.container{padding:6px;margin:6px}
.card{padding:14px}
.chat{padding:10px}
.service-card{padding:14px 8px;min-height:100px}
.service-icon{font-size:32px}
.service-name{font-size:15px}
.controls button{padding:12px}
}
</style>
</head>
<body>

<div class="container">
<div class="card">

<div class="header">
<div class="logo">QueueMitra</div>
<div class="subtitle">Your Smart Voice Queue Assistant</div>
</div>

<div id="languageArea">
<h2 style="text-align:center">Choose Your Language</h2>
<div class="lang-grid">
<button class="lang-button" onclick="startApp('te')">తెలుగు</button>
<button class="lang-button" onclick="startApp('en')">English</button>
<button class="lang-button" onclick="startApp('hi')">हिन्दी</button>
</div>
</div>

<div id="chatArea" class="hidden">
<div id="chat" class="chat"></div>
<div class="controls">
<input id="input" placeholder="Type here..." autocomplete="off">
<button class="primary" onclick="sendText()">➤</button>
<button class="voice" onclick="startListening()">🎙️</button>
</div>
</div>

<div id="tokenArea" class="hidden">
<div id="tokenCard" class="token-card"></div>
<button class="download" onclick="downloadToken()">⬇ Download Token</button>
<button class="restart" onclick="restart()">Start Again</button>
</div>

</div>
</div>

<script>
const API="https://plain-art-16cdqueuemitra-voice.shravyasrirachakonda.workers.dev";

const data={
en:{
welcome:"Welcome to QueueMitra! Please tap the service you need.",
services:["Hospital","Bank","Government Office","Bus","Railway","Electricity","Municipal Office","Other"],
placeQuestions:[
"Which hospital do you want to visit?",
"Which bank do you want to visit?",
"Which government office do you want to visit?",
"Which bus station or destination do you need?",
"Which railway station do you want to visit?",
"Which electricity office do you want to visit?",
"Which municipal office do you want to visit?",
"Which service or place do you need?"
],
name:"What is your name?",
purpose:"What is the purpose of your visit?",
confirm:"Please confirm your details.",
yes:"Confirm",
no:"Change",
generating:"Generating your token...",
done:"Your token has been generated!",
ahead:"There are {n} people ahead of you.",
wait:"Your estimated waiting time is {n} minutes.",
nameLabel:"Name",tokenLabel:"Token Number",serviceLabel:"Service",placeLabel:"Location",purposeLabel:"Purpose",
confirmation:"Please check your details:\nName: {name}\nService: {service}\nLocation: {place}\nPurpose: {purpose}",
thanks:"Thank you for using QueueMitra.",
again:"Let's start again.",
error:"Please try again.",
serviceIcons:["🏥","🏦","🏛️","🚌","🚆","⚡","🏙️","📋"]
},
te:{
welcome:"QueueMitraకి స్వాగతం! మీకు కావలసిన సేవను ఎంచుకోండి.",
services:["ఆసుపత్రి","బ్యాంక్","ప్రభుత్వ కార్యాలయం","బస్సు","రైల్వే","విద్యుత్","మున్సిపల్ కార్యాలయం","ఇతర"],
placeQuestions:[
"మీరు ఏ ఆసుపత్రికి వెళ్లాలనుకుంటున్నారు?",
"మీరు ఏ బ్యాంకుకు వెళ్లాలనుకుంటున్నారు?",
"మీరు ఏ ప్రభుత్వ కార్యాలయానికి వెళ్లాలనుకుంటున్నారు?",
"మీరు ఏ బస్ స్టేషన్‌కు లేదా ఏ ప్రాంతానికి వెళ్లాలి?",
"మీరు ఏ రైల్వే స్టేషన్‌కు వెళ్లాలనుకుంటున్నారు?",
"మీరు ఏ విద్యుత్ కార్యాలయానికి వెళ్లాలనుకుంటున్నారు?",
"మీరు ఏ మున్సిపల్ కార్యాలయానికి వెళ్లాలనుకుంటున్నారు?",
"మీరు ఏ సేవ లేదా ప్రదేశం కోసం వచ్చారు?"
],
name:"మీ పేరు చెప్పండి.",
purpose:"మీరు ఏ పని కోసం వచ్చారు?",
confirm:"మీ వివరాలను నిర్ధారించండి.",
yes:"నిర్ధారించండి",
no:"మార్చండి",
generating:"మీ టోకెన్ రూపొందించబడుతోంది...",
done:"మీ టోకెన్ విజయవంతంగా రూపొందించబడింది!",
ahead:"మీ ముందు {n} మంది ఉన్నారు.",
wait:"మీ అంచనా వేచి ఉండే సమయం {n} నిమిషాలు.",
nameLabel:"పేరు",tokenLabel:"టోకెన్ నంబర్",serviceLabel:"సేవ",placeLabel:"ప్రదేశం",purposeLabel:"పని",
confirmation:"మీ వివరాలను పరిశీలించండి:\nపేరు: {name}\nసేవ: {service}\nప్రదేశం: {place}\nపని: {purpose}",
thanks:"QueueMitra ఉపయోగించినందుకు ధన్యవాదాలు.",
again:"మళ్లీ ప్రారంభిద్దాం.",
error:"దయచేసి మళ్లీ ప్రయత్నించండి.",
serviceIcons:["🏥","🏦","🏛️","🚌","🚆","⚡","🏙️","📋"]
},
hi:{
welcome:"QueueMitra में आपका स्वागत है! कृपया अपनी सेवा चुनें।",
services:["अस्पताल","बैंक","सरकारी कार्यालय","बस","रेलवे","बिजली","नगरपालिका कार्यालय","अन्य"],
placeQuestions:[
"आप किस अस्पताल में जाना चाहते हैं?",
"आप किस बैंक में जाना चाहते हैं?",
"आप किस सरकारी कार्यालय में जाना चाहते हैं?",
"आप किस बस स्टेशन या स्थान पर जाना चाहते हैं?",
"आप किस रेलवे स्टेशन पर जाना चाहते हैं?",
"आप किस बिजली कार्यालय में जाना चाहते हैं?",
"आप किस नगरपालिका कार्यालय में जाना चाहते हैं?",
"आप किस सेवा या स्थान के लिए आए हैं?"
],
name:"कृपया अपना नाम बताएं।",
purpose:"आप किस काम के लिए आए हैं?",
confirm:"कृपया अपने विवरण की पुष्टि करें।",
yes:"पुष्टि करें",
no:"बदलें",
generating:"आपका टोकन बनाया जा रहा है...",
done:"आपका टोकन सफलतापूर्वक बन गया!",
ahead:"आपसे पहले {n} लोग हैं।",
wait:"आपका अनुमानित प्रतीक्षा समय {n} मिनट है।",
nameLabel:"नाम",tokenLabel:"टोकन नंबर",serviceLabel:"सेवा",placeLabel:"स्थान",purposeLabel:"कार्य",
confirmation:"कृपया विवरण जांचें:\nनाम: {name}\nसेवा: {service}\nस्थान: {place}\nकार्य: {purpose}",
thanks:"QueueMitra का उपयोग करने के लिए धन्यवाद.",
again:"फिर से शुरू करते हैं.",
error:"कृपया फिर से प्रयास करें.",
serviceIcons:["🏥","🏦","🏛️","🚌","🚆","⚡","🏙️","📋"]
}
};

let lang="en",step="",name="",service="",place="",purpose="",token="",ahead=0,wait=0,serviceIndex=-1;
const locale={en:"en-IN",te:"te-IN",hi:"hi-IN"};

function startApp(l){
lang=l;
step="service";
document.getElementById("languageArea").classList.add("hidden");
document.getElementById("chatArea").classList.remove("hidden");
document.getElementById("tokenArea").classList.add("hidden");
document.getElementById("chat").innerHTML="";
addBot(data[lang].welcome,true);
showServices();
}

function addMessage(text,type){
const chat=document.getElementById("chat");
const div=document.createElement("div");
div.className="msg "+type;
div.textContent=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

function addBot(text,speech=false){
addMessage(text,"bot");
if(speech)speak(text);
}

function addUser(text){addMessage(text,"user");}

function showServices(){
const chat=document.getElementById("chat");
const grid=document.createElement("div");
grid.className="service-grid";
grid.id="serviceGrid";

data[lang].services.forEach((s,i)=>{
const b=document.createElement("button");
b.className="service-card";
b.innerHTML='<span class="service-icon">'+data[lang].serviceIcons[i]+'</span><span class="service-name">'+s+'</span>';
b.onclick=()=>selectService(i);
grid.appendChild(b);
});

chat.appendChild(grid);
chat.scrollTop=chat.scrollHeight;
}

function selectService(i){
serviceIndex=i;
service=data[lang].services[i];

const grid=document.getElementById("serviceGrid");
if(grid)grid.remove();

addUser(data[lang].serviceIcons[i]+" "+service);
step="name";
addBot(data[lang].name,true);
document.getElementById("input").focus();
}

function sendText(){
const input=document.getElementById("input");
const text=input.value.trim();
if(!text)return;
input.value="";
process(text);
}

document.getElementById("input").addEventListener("keydown",e=>{
if(e.key==="Enter")sendText();
});

function process(text){
addUser(text);

if(step==="name"){
name=text;
step="place";
addBot(data[lang].placeQuestions[serviceIndex],true);
}
else if(step==="place"){
place=text;
step="purpose";
addBot(data[lang].purpose,true);
}
else if(step==="purpose"){
purpose=text;
step="confirm";
const msg=data[lang].confirmation
.replace("{name}",name)
.replace("{service}",service)
.replace("{place}",place)
.replace("{purpose}",purpose);
addBot(msg,true);
showConfirmationButtons();
}
else if(step==="confirm"){
if(isYes(text))generateToken();
else if(isNo(text)){
step="service";
addBot(data[lang].again,true);
showServices();
}
}
}

function showConfirmationButtons(){
const chat=document.getElementById("chat");
const box=document.createElement("div");
box.className="choice";

const yes=document.createElement("button");
yes.className="primary";
yes.textContent=data[lang].yes;
yes.onclick=()=>{
addUser(data[lang].yes);
generateToken();
};

const no=document.createElement("button");
no.textContent=data[lang].no;
no.onclick=()=>{
addUser(data[lang].no);
step="service";
addBot(data[lang].again,true);
showServices();
};

box.appendChild(yes);
box.appendChild(no);
chat.appendChild(box);
chat.scrollTop=chat.scrollHeight;
}

function isYes(text){
return ["yes","y","అవును","అవున","हाँ","हां","जी"].some(x=>text.toLowerCase().includes(x.toLowerCase()));
}
function isNo(text){
return ["no","n","కాదు","వద్దు","नहीं"].some(x=>text.toLowerCase().includes(x.toLowerCase()));
}

async function speak(text){
try{
const res=await fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({text,language:lang})
});
if(!res.ok)throw new Error();
const blob=await res.blob();
const url=URL.createObjectURL(blob);
const audio=new Audio(url);
audio.play();
audio.onended=()=>URL.revokeObjectURL(url);
}catch(e){
console.log("Speech service unavailable");
}
}

function startListening(){
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!Recognition){
addBot(data[lang].error);
return;
}
const r=new Recognition();
r.lang=locale[lang];
r.continuous=false;
r.interimResults=false;
r.onresult=e=>{
document.getElementById("input").value=e.results[0][0].transcript;
sendText();
};
r.onerror=()=>addBot(data[lang].error,true);
r.start();
}

function generateToken(){
step="done";
addBot(data[lang].generating,true);

// Demo-only simulated queue values.
ahead=Math.floor(Math.random()*15)+1;
wait=ahead*2;
token=Math.floor(Math.random()*900)+100;

setTimeout(()=>{
addBot(data[lang].done+"\n"+data[lang].ahead.replace("{n}",ahead)+"\n"+data[lang].wait.replace("{n}",wait),true);
renderToken();
},800);
}

function renderToken(){
document.getElementById("tokenArea").classList.remove("hidden");
document.getElementById("tokenCard").innerHTML=
'<div style="letter-spacing:3px;color:#64748b;font-weight:bold">QUEUEMITRA</div>'+
'<h2>QUEUE TOKEN</h2>'+
'<div style="color:#64748b">Digital Service Ticket</div>'+
'<hr>'+
'<div style="text-align:left;color:#64748b">'+data[lang].nameLabel+'</div>'+
'<div style="font-size:22px;font-weight:bold;margin:8px 0 20px">'+esc(name)+'</div>'+
'<div style="color:#64748b">'+data[lang].tokenLabel+'</div>'+
'<div class="token-number">'+token+'</div>'+
'<div class="token-info">'+
'<strong>'+data[lang].serviceLabel+':</strong> '+esc(service)+'<br>'+
'<strong>'+data[lang].placeLabel+':</strong> '+esc(place)+'<br>'+
'<strong>'+data[lang].purposeLabel+':</strong> '+esc(purpose)+
'</div><hr><div style="color:#64748b">'+data[lang].thanks+'</div>';
}

function esc(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function downloadToken(){
const c=document.createElement("canvas");
c.width=900;c.height=1100;
const x=c.getContext("2d");

x.fillStyle="#eff4fb";x.fillRect(0,0,900,1100);
x.fillStyle="#fff";roundRect(x,60,760,980,30);x.fill();

x.textAlign="center";
x.fillStyle="#2563eb";x.font="bold 48px Arial";x.fillText("QueueMitra",450,150);
x.fillStyle="#64748b";x.font="24px Arial";x.fillText("DIGITAL QUEUE TOKEN",450,200);

x.setLineDash([8,8]);x.strokeStyle="#cbd5e1";
x.beginPath();x.moveTo(140,240);x.lineTo(760,240);x.stroke();x.setLineDash([]);

x.textAlign="left";
x.fillStyle="#64748b";x.font="24px Arial";x.fillText(data[lang].nameLabel,150,310);
x.fillStyle="#172033";x.font="bold 36px Arial";wrap(x,name,150,360,600,45);

x.textAlign="center";x.fillStyle="#64748b";x.font="24px Arial";x.fillText(data[lang].tokenLabel,450,450);
x.fillStyle="#2563eb";x.font="bold 110px Arial";x.fillText(String(token),450,570);

x.textAlign="left";x.fillStyle="#64748b";x.font="26px Arial";x.fillText(data[lang].serviceLabel+":",150,665);
x.fillStyle="#172033";x.font="bold 30px Arial";wrap(x,service,150,715,600,40);

x.fillStyle="#64748b";x.font="26px Arial";x.fillText(data[lang].placeLabel+":",150,810);
x.fillStyle="#172033";x.font="bold 30px Arial";wrap(x,place,150,855,600,40);

x.fillStyle="#64748b";x.font="26px Arial";x.fillText(data[lang].purposeLabel+":",150,940);
x.fillStyle="#172033";x.font="bold 30px Arial";wrap(x,purpose,150,985,600,40);

x.textAlign="center";x.fillStyle="#64748b";x.font="22px Arial";x.fillText("Thank you for using QueueMitra",450,1030);

const a=document.createElement("a");
a.download="QueueMitra-"+token+".png";
a.href=c.toDataURL("image/png");
a.click();
}

function wrap(ctx,text,x,y,max,line){
const words=String(text).split(" ");let s="";
for(let i=0;i<words.length;i++){
const t=s+words[i]+" ";
if(ctx.measureText(t).width>max&&i>0){
ctx.fillText(s,x,y);s=words[i]+" ";y+=line;
}else s=t;
}
ctx.fillText(s,x,y);
}

function roundRect(ctx,x,y,w,h,r){
ctx.beginPath();ctx.moveTo(x+r,y);
ctx.arcTo(x+w,y,x+w,y+h,r);
ctx.arcTo(x+w,y+h,x,y+h,r);
ctx.arcTo(x,y+h,x,y,r);
ctx.arcTo(x,y,x+w,y,r);
ctx.closePath();
}

function restart(){
lang="en";step="";name=service=place=purpose=token="";
serviceIndex=-1;
document.getElementById("languageArea").classList.remove("hidden");
document.getElementById("chatArea").classList.add("hidden");
document.getElementById("tokenArea").classList.add("hidden");
}
</script>
</body>
</html>
