<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueMitra – Voice Queue Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eff6ff, #f5f3ff);
  color: #172033;
  min-height: 100vh;
}

.container {
  max-width: 720px;
  margin: 30px auto;
  padding: 24px;
}

.card {
  background: white;
  padding: 28px;
  border-radius: 20px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 42px;
}

h1 {
  margin: 8px 0;
  color: #4f46e5;
}

.subtitle {
  color: #64748b;
}

label {
  display: block;
  margin-top: 18px;
  font-weight: bold;
}

select, input, textarea {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #dbe2ee;
  margin-top: 8px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 14px 18px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.primary {
  width: 100%;
  margin-top: 22px;
  color: white;
  background: #4f46e5;
}

.primary:hover {
  background: #4338ca;
}

.secondary {
  color: #4f46e5;
  background: #eef2ff;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.hidden {
  display: none !important;
}

.status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  background: #eef2ff;
  color: #4338ca;
  min-height: 48px;
}

.status.error {
  background: #fee2e2;
  color: #991b1b;
}

.status.success {
  background: #dcfce7;
  color: #166534;
}

.token {
  text-align: center;
  padding: 30px;
  background: #eef2ff;
  border-radius: 16px;
  margin: 20px 0;
}

.token-number {
  font-size: 65px;
  font-weight: bold;
  color: #4f46e5;
  margin: 20px 0;
}

.small {
  color: #64748b;
  font-size: 14px;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.actions button {
  flex: 1;
}

.footer {
  text-align: center;
  margin-top: 25px;
  color: #64748b;
  font-size: 13px;
}

@media(max-width:600px) {
  .container {
    padding: 12px;
  }

  .card {
    padding: 20px;
  }

  .actions {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<div class="header">
  <div class="logo">🎙️</div>
  <h1>QueueMitra</h1>
  <p class="subtitle">
    Voice-powered queue assistant
  </p>
</div>

<div id="mainScreen">

<label for="language">Choose Language</label>
<select id="language">
  <option value="en">English</option>
  <option value="te">తెలుగు</option>
  <option value="hi">हिन्दी</option>
</select>

<label for="service">Select Service</label>
<select id="service">
  <option value="Hospital">Hospital</option>
  <option value="Bank">Bank</option>
  <option value="Government Office">Government Office</option>
  <option value="Restaurant">Restaurant</option>
  <option value="Other">Other</option>
</select>

<label for="name">Your Name</label>
<input id="name" placeholder="Enter your name">

<label for="location">Location / Branch</label>
<input id="location" placeholder="Enter branch or location">

<label for="purpose">Purpose of Visit</label>
<textarea id="purpose" rows="3"
placeholder="Why are you visiting?"></textarea>

<button class="primary" id="startBtn">
  🎤 Start Voice Assistant
</button>

<div class="status" id="status">
  Choose your language and start.
</div>

</div>

<div id="tokenScreen" class="hidden">

<h2 style="text-align:center">Your Queue Token</h2>

<div class="token">
  <div class="small">TOKEN NUMBER</div>
  <div class="token-number" id="tokenNumber">Q001</div>
  <div id="tokenDetails"></div>
</div>

<div class="status success" id="tokenStatus">
  Token generated successfully!
</div>

<div class="actions">
  <button class="secondary" id="downloadBtn">
    Download Token
  </button>

  <button class="secondary" id="newBtn">
    New Queue
  </button>
</div>

</div>

</div>

<div class="footer">
  QueueMitra – Simplifying queues with voice
</div>
</div>

<script>
const WORKER_URL =
"https://plain-art-16cdqueuemitra-voice.shravyasrirachakonda.workers.dev";

const languageEl = document.getElementById("language");
const serviceEl = document.getElementById("service");
const nameEl = document.getElementById("name");
const locationEl = document.getElementById("location");
const purposeEl = document.getElementById("purpose");

const startBtn = document.getElementById("startBtn");
const statusEl = document.getElementById("status");

const mainScreen = document.getElementById("mainScreen");
const tokenScreen = document.getElementById("tokenScreen");

const tokenNumberEl = document.getElementById("tokenNumber");
const tokenDetailsEl = document.getElementById("tokenDetails");

let currentAudio = null;
let recognition = null;
let recognitionActive = false;
let recognitionAvailable = false;
let flowRunning = false;

const translations = {
  en: {
    welcome: "Welcome to QueueMitra.",
    name: "Please tell me your name.",
    location: "Please tell me your branch or location.",
    purpose: "Please tell me the purpose of your visit.",
    confirm: "Your details have been entered. Your queue token is being generated.",
    done: "Your token has been generated successfully.",
    listening: "Listening. Please speak now.",
    error: "I could not hear you. Please type your answer instead.",
    start: "Voice assistant started.",
    token: "Your token number is"
  },

  te: {
    welcome: "క్యూ మిత్రకు స్వాగతం.",
    name: "దయచేసి మీ పేరు చెప్పండి.",
    location: "దయచేసి మీ బ్రాంచ్ లేదా ప్రాంతం పేరు చెప్పండి.",
    purpose: "దయచేసి మీరు వచ్చిన కారణం చెప్పండి.",
    confirm: "మీ వివరాలు నమోదు చేయబడ్డాయి. మీ టోకెన్ రూపొందించబడుతోంది.",
    done: "మీ టోకెన్ విజయవంతంగా రూపొందించబడింది.",
    listening: "వింటున్నాను. దయచేసి మాట్లాడండి.",
    error: "మీ మాటలు వినలేకపోయాను. దయచేసి మీ సమాధానాన్ని టైప్ చేయండి.",
    start: "వాయిస్ అసిస్టెంట్ ప్రారంభమైంది.",
    token: "మీ టోకెన్ నంబర్"
  },

  hi: {
    welcome: "QueueMitra में आपका स्वागत है।",
    name: "कृपया अपना नाम बताएं।",
    location: "कृपया अपनी शाखा या स्थान बताएं।",
    purpose: "कृपया आने का कारण बताएं।",
    confirm: "आपकी जानकारी दर्ज हो गई है। आपका टोकन बनाया जा रहा है।",
    done: "आपका टोकन सफलतापूर्वक बन गया है।",
    listening: "मैं सुन रहा हूं। कृपया बोलें।",
    error: "मैं आपकी बात नहीं सुन पाया। कृपया अपना जवाब टाइप करें।",
    start: "वॉयस असिस्टेंट शुरू हो गया है।",
    token: "आपका टोकन नंबर है"
  }
};

function getLang() {
  return languageEl.value;
}

function setStatus(message, type = "") {
  statusEl.textContent = message;
  statusEl.className = "status " + type;
}

function browserSpeak(text, lang) {
  return new Promise((resolve) => {
    if (!("speechSynthesis" in window)) {
      resolve();
      return;
    }

    try {
      speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);

      const voiceLanguage = {
        en: "en-IN",
        te: "te-IN",
        hi: "hi-IN"
      };

      utterance.lang = voiceLanguage[lang] || "en-IN";
      utterance.rate = 0.95;
      utterance.pitch = 1;

      utterance.onend = () => resolve();
      utterance.onerror = () => resolve();

      speechSynthesis.speak(utterance);

      // Safety timeout in case browser events do not fire.
      setTimeout(resolve, 15000);
    } catch (e) {
      resolve();
    }
  });
}

/*
  Telugu speech uses Vakyam through the Worker.
  English and Hindi use browser speech.
*/
async function speak(text, lang = getLang()) {

  if (lang !== "te") {
    await browserSpeak(text, lang);
    return;
  }

  setStatus("తెలుగు వాయిస్ ప్రారంభమవుతోంది...");

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        text: text,
        language: "te"
      })
    });

    if (!response.ok) {
      throw new Error("Worker request failed: " + response.status);
    }

    const data = await response.json();

    let audioValue = data.audio;

    if (typeof audioValue === "object" && audioValue !== null) {
      audioValue =
        audioValue.audio ||
        audioValue.data ||
        audioValue.base64;
    }

    if (!audioValue || typeof audioValue !== "string") {
      throw new Error("Audio data missing");
    }

    let audioSrc;

    if (/^(https?:|data:|blob:)/i.test(audioValue)) {
      audioSrc = audioValue;
    } else {
      // FIX: Explicit MP3 MIME type
      audioSrc = "data:audio/mpeg;base64," + audioValue;
    }

    currentAudio = new Audio(audioSrc);

    await new Promise((resolve, reject) => {

      currentAudio.onended = () => {
        currentAudio = null;
        resolve();
      };

      currentAudio.onerror = () => {
        currentAudio = null;
        reject(new Error("Audio playback failed"));
      };

      currentAudio.play().catch(reject);

      // Prevent a stuck audio promise.
      setTimeout(() => {
        if (currentAudio) {
          currentAudio = null;
          resolve();
        }
      }, 30000);
    });

    return;

  } catch (error) {

    console.error("Telugu TTS error:", error);

    // Fallback to browser Telugu speech.
    await browserSpeak(text, "te");
  }
}

/*
  Speech recognition for spoken answers.
  TTS completes before recognition starts.
*/
function createRecognition(lang) {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    return null;
  }

  const r = new SpeechRecognition();

  const speechLang = {
    en: "en-IN",
    te: "te-IN",
    hi: "hi-IN"
  };

  r.lang = speechLang[lang] || "en-IN";
  r.continuous = false;
  r.interimResults = false;
  r.maxAlternatives = 1;

  return r;
}

function listenOnce() {

  return new Promise((resolve) => {

    recognition = createRecognition(getLang());

    if (!recognition) {
      resolve("");
      return;
    }

    recognitionAvailable = true;
    recognitionActive = false;

    recognition.onstart = () => {
      recognitionActive = true;
      setStatus(translations[getLang()].listening);
    };

    recognition.onresult = (event) => {
      const result = event.results[0][0].transcript;
      resolve(result);
    };

    recognition.onerror = () => {
      resolve("");
    };

    recognition.onend = () => {
      recognitionActive = false;
    };

    try {
      recognition.start();
    } catch (e) {
      resolve("");
    }

    setTimeout(() => {
      try {
        recognition.stop();
      } catch (e) {}
      resolve("");
    }, 12000);

  });
}

async function askQuestion(question, field) {

  await speak(question, getLang());

  const answer = await listenOnce();

  if (answer) {
    field.value = answer;
    return answer;
  }

  setStatus(
    translations[getLang()].error,
    "error"
  );

  return "";
}

/*
  Main voice assistant flow.
*/
async function startAssistant() {

  if (flowRunning) return;

  flowRunning = true;
  startBtn.disabled = true;

  const lang = getLang();
  const t = translations[lang];

  try {

    await speak(t.welcome, lang);

    if (!nameEl.value.trim()) {
      await askQuestion(t.name, nameEl);
    }

    if (!locationEl.value.trim()) {
      await askQuestion(t.location, locationEl);
    }

    if (!purposeEl.value.trim()) {
      await askQuestion(t.purpose, purposeEl);
    }

    if (
      !nameEl.value.trim() ||
      !locationEl.value.trim() ||
      !purposeEl.value.trim()
    ) {

      setStatus(
        "Please fill all fields before generating your token.",
        "error"
      );

      startBtn.disabled = false;
      flowRunning = false;
      return;
    }

    await speak(t.confirm, lang);

    generateToken();

    await speak(t.done, lang);

  } catch (error) {

    console.error(error);

    setStatus(
      "Something went wrong. Please try again.",
      "error"
    );

  } finally {

    startBtn.disabled = false;
    flowRunning = false;

  }
}

function generateToken() {

  const number =
    "Q" + Math.floor(100 + Math.random() * 900);

  tokenNumberEl.textContent = number;

  tokenDetailsEl.innerHTML = `
    <p><strong>Name:</strong> ${escapeHTML(nameEl.value)}</p>
    <p><strong>Service:</strong> ${escapeHTML(serviceEl.value)}</p>
    <p><strong>Location:</strong> ${escapeHTML(locationEl.value)}</p>
    <p><strong>Purpose:</strong> ${escapeHTML(purposeEl.value)}</p>
  `;

  mainScreen.classList.add("hidden");
  tokenScreen.classList.remove("hidden");

  setStatus(translations[getLang()].done, "success");
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, function(m) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[m];
  });
}

startBtn.addEventListener("click", startAssistant);
document.getElementById("downloadBtn")
.addEventListener("click", function() {

  const canvas = document.createElement("canvas");
  canvas.width = 800;
  canvas.height = 500;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#4f46e5";
  ctx.fillRect(0, 0, canvas.width, 100);

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 40px Arial";
  ctx.textAlign = "center";
  ctx.fillText("QueueMitra", 400, 65);

  ctx.fillStyle = "#172033";
  ctx.font = "28px Arial";
  ctx.fillText("Your Queue Token", 400, 160);

  ctx.fillStyle = "#4f46e5";
  ctx.font = "bold 100px Arial";
  ctx.fillText(tokenNumberEl.textContent, 400, 285);

  ctx.fillStyle = "#172033";
  ctx.font = "24px Arial";

  ctx.fillText(
    "Name: " + nameEl.value,
    400,
    345
  );

  ctx.fillText(
    "Service: " + serviceEl.value,
    400,
    390
  );

  ctx.fillText(
    "Location: " + locationEl.value,
    400,
    430
  );

  ctx.fillStyle = "#64748b";
  ctx.font = "18px Arial";
  ctx.fillText(
    "Thank you for using QueueMitra",
    400,
    475
  );

  const link = document.createElement("a");

  link.download = "QueueMitra-Token.png";
  link.href = canvas.toDataURL("image/png");

  link.click();
});

document.getElementById("newBtn")
.addEventListener("click", function() {

  nameEl.value = "";
  locationEl.value = "";
  purposeEl.value = "";

  tokenScreen.classList.add("hidden");
  mainScreen.classList.remove("hidden");

  setStatus(
    "Choose your language and start."
  );

  startBtn.disabled = false;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});

</script>
</body>
</html>
