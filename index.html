<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueMitra</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f1f5f9;color:#172033}
.container{max-width:760px;margin:30px auto;padding:20px}
.card{background:#fff;border-radius:20px;padding:25px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.header{text-align:center;margin-bottom:25px}
.logo{font-size:32px;font-weight:800;color:#2563eb}
.subtitle{color:#64748b}
h2{margin-top:10px}
.chat{height:350px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:15px;padding:15px;margin:20px 0;background:#f8fafc}
.msg{padding:12px 15px;border-radius:15px;margin:10px 0;max-width:85%;line-height:1.5;white-space:pre-wrap}
.bot{background:#e0edff;color:#1e3a8a}
.user{background:#2563eb;color:white;margin-left:auto}
.controls{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
input{flex:1;min-width:180px;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}
button{border:0;border-radius:12px;padding:13px 18px;cursor:pointer;font-size:15px;font-weight:600}
.primary{background:#2563eb;color:white}
.secondary{background:#e2e8f0;color:#334155}
button:hover{opacity:.9}
.languages,.services{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.services{grid-template-columns:repeat(2,1fr)}
.langBtn,.serviceBtn{background:#fff;border:2px solid #dbeafe;color:#1e40af;padding:16px}
.langBtn:hover,.serviceBtn:hover{background:#eff6ff}
.hidden{display:none!important}
#tokenArea{margin-top:20px}
.tokenCard{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:22px;text-align:center}
.tokenNumber{font-size:48px;font-weight:800;color:#2563eb;margin:15px 0}
.tokenInfo{text-align:left;line-height:2;border-top:1px dashed #cbd5e1;margin-top:15px;padding-top:15px}
.download{width:100%;margin-top:18px;background:#16a34a;color:white}
.voice{background:#7c3aed;color:white}
@media(max-width:600px){.container{padding:10px;margin:10px auto}.card{padding:18px}.languages{grid-template-columns:1fr}.chat{height:300px}}
</style>
</head>
<body>
<div class="container">
<div class="card">
<div class="header">
<div class="logo">QueueMitra</div>
<div class="subtitle">Your Smart Voice Queue Assistant</div>
</div>

<div id="languageArea">
<h2>Select Your Language</h2>
<div class="languages">
<button class="langBtn" onclick="startApp('en')">English</button>
<button class="langBtn" onclick="startApp('te')">తెలుగు</button>
<button class="langBtn" onclick="startApp('hi')">हिन्दी</button>
</div>
</div>

<div id="chatArea" class="hidden">
<div id="chat" class="chat"></div>
<div id="serviceArea" class="services hidden"></div>
<div class="controls">
<input id="input" placeholder="Type your response..." autocomplete="off">
<button class="primary" onclick="sendText()">Send</button>
<button class="voice" onclick="startListening()">🎙️</button>
</div>
</div>

<div id="tokenArea" class="hidden">
<div id="tokenCard" class="tokenCard"></div>
<button class="download" onclick="downloadToken()">⬇ Download Token</button>
<button class="secondary" style="width:100%;margin-top:10px" onclick="restart()">Start Again</button>
</div>
</div>
</div>

<script>
const API="https://plain-art-16cdqueuemitra-voice.shravyasrirachakonda.workers.dev";

const T={
en:{
greeting:"Welcome to QueueMitra! Please select a service.",
services:["Hospital","Bank","Government Office","Bus","Railway","Electricity","Municipal Office","Other"],
name:"Please tell me your name.",
place:"Please tell me the location or provider name.",
purpose:"What is the purpose of your visit?",
confirm:"Please confirm your details.",
yes:"Yes",
no:"No",
generating:"Generating your token...",
done:"Your token has been generated successfully!",
ahead:"There are {n} people ahead of you in the queue.",
wait:"Your estimated waiting time is {n} minutes. Please wait until your token is called.",
askAgain:"Please enter your response.",
restart:"Let's start again. Please select a service.",
nameLabel:"Name",token:"Token Number",service:"Service",placeLabel:"Location",purposeLabel:"Purpose",
confirmation:"Your details:\nName: {name}\nService: {service}\nLocation: {place}\nPurpose: {purpose}\nIs this correct?",
download:"Download Token",
thanks:"Thank you for using QueueMitra.",
error:"Sorry, I couldn't understand. Please try again.",
cancel:"Okay. Let's start again.",
serviceNames:["Hospital","Bank","Government Office","Bus","Railway","Electricity","Municipal Office","Other"]
},
te:{
greeting:"QueueMitraకి స్వాగతం! దయచేసి సేవను ఎంచుకోండి.",
services:["ఆసుపత్రి","బ్యాంక్","ప్రభుత్వ కార్యాలయం","బస్సు","రైల్వే","విద్యుత్","మున్సిపల్ కార్యాలయం","ఇతర"],
name:"దయచేసి మీ పేరు చెప్పండి.",
place:"దయచేసి ప్రదేశం లేదా సంస్థ పేరు చెప్పండి.",
purpose:"మీరు ఏ పని కోసం వచ్చారు?",
confirm:"దయచేసి మీ వివరాలను నిర్ధారించండి.",
yes:"అవును",
no:"కాదు",
generating:"మీ టోకెన్ రూపొందించబడుతోంది...",
done:"మీ టోకెన్ విజయవంతంగా రూపొందించబడింది!",
ahead:"మీ ముందు క్యూ లో {n} మంది ఉన్నారు.",
wait:"మీ అంచనా వేచి ఉండే సమయం {n} నిమిషాలు. మీ టోకెన్ పిలిచే వరకు దయచేసి వేచి ఉండండి.",
askAgain:"దయచేసి మళ్లీ చెప్పండి.",
nameLabel:"పేరు",token:"టోకెన్ నంబర్",service:"సేవ",placeLabel:"ప్రదేశం",purposeLabel:"పని",
confirmation:"మీ వివరాలు:\nపేరు: {name}\nసేవ: {service}\nప్రదేశం: {place}\nపని: {purpose}\nఈ వివరాలు సరైనవేనా?",
download:"టోకెన్ డౌన్‌లోడ్",
thanks:"QueueMitra ఉపయోగించినందుకు ధన్యవాదాలు.",
error:"క్షమించండి, అర్థం కాలేదు. దయచేసి మళ్లీ ప్రయత్నించండి.",
cancel:"సరే. మళ్లీ ప్రారంభిద్దాం.",
serviceNames:["ఆసుపత్రి","బ్యాంక్","ప్రభుత్వ కార్యాలయం","బస్సు","రైల్వే","విద్యుత్","మున్సిపల్ కార్యాలయం","ఇతర"]
},
hi:{
greeting:"QueueMitra में आपका स्वागत है! कृपया सेवा चुनें।",
services:["अस्पताल","बैंक","सरकारी कार्यालय","बस","रेलवे","बिजली","नगरपालिका कार्यालय","अन्य"],
name:"कृपया अपना नाम बताएं।",
place:"कृपया स्थान या संस्था का नाम बताएं।",
purpose:"आप किस काम के लिए आए हैं?",
confirm:"कृपया अपने विवरण की पुष्टि करें।",
yes:"हाँ",
no:"नहीं",
generating:"आपका टोकन बनाया जा रहा है...",
done:"आपका टोकन सफलतापूर्वक बन गया है!",
ahead:"आपसे पहले कतार में {n} लोग हैं।",
wait:"आपका अनुमानित प्रतीक्षा समय {n} मिनट है। कृपया अपने टोकन के बुलाए जाने तक प्रतीक्षा करें।",
askAgain:"कृपया अपना जवाब दें।",
nameLabel:"नाम",token:"टोकन नंबर",service:"सेवा",placeLabel:"स्थान",purposeLabel:"कार्य",
confirmation:"आपके विवरण:\nनाम: {name}\nसेवा: {service}\nस्थान: {place}\nकार्य: {purpose}\nक्या यह सही है?",
download:"टोकन डाउनलोड करें",
thanks:"QueueMitra का उपयोग करने के लिए धन्यवाद।",
error:"माफ़ कीजिए, समझ नहीं आया। कृपया फिर से प्रयास करें।",
cancel:"ठीक है। फिर से शुरू करते हैं।",
serviceNames:["अस्पताल","बैंक","सरकारी कार्यालय","बस","रेलवे","बिजली","नगरपालिका कार्यालय","अन्य"]
}
};

let lang="en",step="",name="",service="",place="",purpose="",token="",aheadCount=0,waitTime=0;

const langCode={en:"en-IN",te:"te-IN",hi:"hi-IN"};

function startApp(l){
lang=l;
step="service";
document.getElementById("languageArea").classList.add("hidden");
document.getElementById("chatArea").classList.remove("hidden");
document.getElementById("tokenArea").classList.add("hidden");
document.getElementById("chat").innerHTML="";
showServices();
addBot(T[lang].greeting,true);
}

function showServices(){
const area=document.getElementById("serviceArea");
area.innerHTML="";
T[lang].services.forEach((s,i)=>{
const b=document.createElement("button");
b.className="serviceBtn";
b.textContent=s;
b.onclick=()=>selectService(i);
area.appendChild(b);
});
area.classList.remove("hidden");
}

function addBot(text,speech=false){
addMessage(text,"bot");
if(speech)speak(text);
}

function addUser(text){
addMessage(text,"user");
}

function addMessage(text,type){
const chat=document.getElementById("chat");
const div=document.createElement("div");
div.className="msg "+type;
div.textContent=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

function selectService(i){
service=T[lang].services[i];
addUser(service);
document.getElementById("serviceArea").classList.add("hidden");
step="name";
addBot(T[lang].name,true);
document.getElementById("input").focus();
}

function sendText(){
const input=document.getElementById("input");
const text=input.value.trim();
if(!text)return;
input.value="";
processText(text);
}

document.getElementById("input").addEventListener("keydown",e=>{
if(e.key==="Enter")sendText();
});

function processText(text){
addUser(text);
if(step==="name"){
name=text;
step="place";
addBot(T[lang].place,true);
}
else if(step==="place"){
place=text;
step="purpose";
addBot(T[lang].purpose,true);
}
else if(step==="purpose"){
purpose=text;
step="confirm";
let msg=T[lang].confirmation.replace("{name}",name).replace("{service}",service).replace("{place}",place).replace("{purpose}",purpose);
addBot(msg,true);
}
else if(step==="confirm"){
if(isYes(text)){
generateToken();
}else if(isNo(text)){
step="service";
addBot(T[lang].cancel,true);
showServices();
}else{
addBot(T[lang].askAgain,true);
}
}
}

function isYes(text){
text=text.toLowerCase().trim();
return ["yes","y","అవును","అవున","हाँ","हां","जी","ঠিক"].some(x=>text.includes(x));
}
function isNo(text){
text=text.toLowerCase().trim();
return ["no","n","కాదు","వద్దు","नहीं","ना"].some(x=>text.includes(x));
}

async function speak(text){
try{
const response=await fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({text,language:lang})
});
if(!response.ok)throw new Error("TTS error");
const blob=await response.blob();
const url=URL.createObjectURL(blob);
const audio=new Audio(url);
audio.play();
audio.onended=()=>URL.revokeObjectURL(url);
}catch(e){
console.log("Speech service unavailable",e);
}
}

function startListening(){
if(!("webkitSpeechRecognition" in window || "SpeechRecognition" in window)){
addBot("Speech recognition is not supported in this browser. Please type your response.");
return;
}
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const recognition=new SpeechRecognition();
recognition.lang=langCode[lang];
recognition.continuous=false;
recognition.interimResults=false;
recognition.onresult=e=>{
const text=e.results[0][0].transcript;
document.getElementById("input").value=text;
sendText();
};
recognition.onerror=()=>addBot(T[lang].error,true);
recognition.start();
}

function generateToken(){
step="done";
document.getElementById("serviceArea").classList.add("hidden");

addBot(T[lang].generating,true);

// Demo queue simulation: these values are simulated, not connected to a real queue.
aheadCount=Math.floor(Math.random()*15)+1;
waitTime=aheadCount*2;

token=Math.floor(Math.random()*900)+100;

setTimeout(()=>{
const message=T[lang].done+"\n"+T[lang].ahead.replace("{n}",aheadCount)+"\n"+T[lang].wait.replace("{n}",waitTime);
addBot(message,true);
renderToken();
},1000);
}

function renderToken(){
document.getElementById("tokenArea").classList.remove("hidden");
document.getElementById("tokenCard").innerHTML=`
<div style="font-size:14px;letter-spacing:3px;font-weight:bold;color:#64748b">QUEUEMITRA</div>
<div style="font-size:22px;font-weight:bold;margin-top:8px">QUEUE TOKEN</div>
<div style="font-size:13px;color:#64748b">Digital Service Ticket</div>
<hr style="border:0;border-top:1px solid #e2e8f0;margin:20px 0">
<div style="text-align:left;color:#64748b;font-size:13px">${T[lang].nameLabel}</div>
<div style="font-size:20px;font-weight:bold;margin:5px 0 15px">${escapeHtml(name)}</div>
<div style="color:#64748b;font-size:13px">${T[lang].token}</div>
<div class="tokenNumber">${token}</div>
<div class="tokenInfo">
<strong>${T[lang].service}:</strong> ${escapeHtml(service)}<br>
<strong>${T[lang].placeLabel}:</strong> ${escapeHtml(place)}<br>
<strong>${T[lang].purposeLabel}:</strong> ${escapeHtml(purpose)}
</div>
<hr style="border:0;border-top:1px dashed #cbd5e1;margin:20px 0">
<div style="font-size:13px;color:#64748b">${T[lang].thanks}</div>
`;
}

function escapeHtml(str){
return String(str).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function downloadToken(){
const canvas=document.createElement("canvas");
canvas.width=900;
canvas.height=1150;
const ctx=canvas.getContext("2d");

ctx.fillStyle="#f1f5f9";
ctx.fillRect(0,0,900,1150);

ctx.fillStyle="#ffffff";
roundRect(ctx,70,60,760,1030,30);
ctx.fill();

ctx.textAlign="center";
ctx.fillStyle="#2563eb";
ctx.font="bold 48px Arial";
ctx.fillText("QueueMitra",450,145);

ctx.fillStyle="#64748b";
ctx.font="24px Arial";
ctx.fillText("DIGITAL QUEUE TOKEN",450,195);

ctx.strokeStyle="#cbd5e1";
ctx.setLineDash([8,8]);
ctx.beginPath();
ctx.moveTo(130,230);
ctx.lineTo(770,230);
ctx.stroke();
ctx.setLineDash([]);

ctx.textAlign="left";
ctx.fillStyle="#64748b";
ctx.font="24px Arial";
ctx.fillText(T[lang].nameLabel,150,300);

ctx.fillStyle="#172033";
ctx.font="bold 36px Arial";
ctx.fillText(name,150,355);

ctx.textAlign="center";
ctx.fillStyle="#64748b";
ctx.font="24px Arial";
ctx.fillText(T[lang].token,450,440);

ctx.fillStyle="#2563eb";
ctx.font="bold 110px Arial";
ctx.fillText(String(token),450,565);

ctx.textAlign="left";
ctx.fillStyle="#64748b";
ctx.font="26px Arial";
ctx.fillText(T[lang].service+":",150,665);

ctx.fillStyle="#172033";
ctx.font="bold 30px Arial";
wrapText(ctx,service,150,715,600,40);

ctx.fillStyle="#64748b";
ctx.font="26px Arial";
ctx.fillText(T[lang].placeLabel+":",150,800);

ctx.fillStyle="#172033";
ctx.font="bold 30px Arial";
wrapText(ctx,place,150,850,600,40);

ctx.fillStyle="#64748b";
ctx.font="26px Arial";
ctx.fillText(T[lang].purposeLabel+":",150,930);

ctx.fillStyle="#172033";
ctx.font="bold 30px Arial";
wrapText(ctx,purpose,150,980,600,40);

ctx.textAlign="center";
ctx.fillStyle="#64748b";
ctx.font="22px Arial";
ctx.fillText("Thank you for using QueueMitra",450,1050);

const link=document.createElement("a");
link.download="QueueMitra-Token-"+token+".png";
link.href=canvas.toDataURL("image/png");
link.click();
}

function wrapText(ctx,text,x,y,maxWidth,lineHeight){
const words=String(text).split(" ");
let line="";
for(let i=0;i<words.length;i++){
const test=line+words[i]+" ";
if(ctx.measureText(test).width>maxWidth&&i>0){
ctx.fillText(line,x,y);
line=words[i]+" ";
y+=lineHeight;
}else line=test;
}
ctx.fillText(line,x,y);
}

function roundRect(ctx,x,y,w,h,r){
ctx.beginPath();
ctx.moveTo(x+r,y);
ctx.arcTo(x+w,y,x+w,y+h,r);
ctx.arcTo(x+w,y+h,x,y+h,r);
ctx.arcTo(x,y+h,x,y,r);
ctx.arcTo(x,y,x+w,y,r);
ctx.closePath();
}

function restart(){
step="";
name=service=place=purpose=token="";
aheadCount=waitTime=0;
document.getElementById("languageArea").classList.remove("hidden");
document.getElementById("chatArea").classList.add("hidden");
document.getElementById("tokenArea").classList.add("hidden");
}
</script>
</body>
</html>
