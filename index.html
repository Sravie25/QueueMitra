
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueMitra - Voice Queue Assistant</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#eef4ff,#f5f7fb);
  color:#1e293b;
}
.container{
  max-width:1050px;
  margin:35px auto;
  background:white;
  padding:30px;
  border-radius:24px;
  box-shadow:0 12px 40px rgba(0,0,0,.08);
}
header{text-align:center;margin-bottom:25px}
header h1{color:#2563eb;margin-bottom:8px}
header p{color:#64748b}
#languageScreen{text-align:center;padding:30px 10px}
.languages{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin:30px 0;
}
.langBtn{
  padding:28px 15px;
  border:2px solid #e2e8f0;
  background:white;
  border-radius:18px;
  cursor:pointer;
  font-size:22px;
  font-weight:bold;
  transition:.2s;
}
.langBtn:hover{
  border-color:#2563eb;
  background:#eff6ff;
  transform:translateY(-3px);
}
.langBtn span{display:block;font-size:14px;margin-top:10px;color:#64748b}
#chatScreen{display:none}
.chat{
  height:440px;
  overflow-y:auto;
  background:#f8fafc;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}
.message{
  padding:16px 20px;
  margin:12px 0;
  border-radius:18px;
  max-width:90%;
  line-height:1.6;
  word-wrap:break-word;
}
.user{
  background:#dcfce7;
  margin-left:auto;
  text-align:right;
}
.bot{
  background:#e8efff;
  margin-right:auto;
}
.controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}
input{
  flex:1;
  min-width:200px;
  padding:18px;
  font-size:17px;
  border:1px solid #cbd5e1;
  border-radius:15px;
}
button.action{
  padding:17px 24px;
  border:none;
  border-radius:15px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}
.send{background:#2563eb;color:white}
.speak{background:#e2e8f0;color:#1e293b}
.reset{background:#fee2e2;color:#b91c1c}
.status{
  text-align:center;
  font-weight:bold;
  color:#0f766e;
  padding:20px;
}
.services{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:12px;
  margin:20px 0;
}
.service{
  border:2px solid #e2e8f0;
  background:white;
  padding:16px;
  border-radius:14px;
  cursor:pointer;
  text-align:center;
  font-weight:bold;
}
.service:hover,.service.selected{
  border-color:#2563eb;
  background:#eff6ff;
}
.hidden{display:none!important}
.token{
  border:2px dashed #2563eb;
  padding:25px;
  text-align:center;
  margin-top:20px;
  border-radius:18px;
  background:#eff6ff;
}
.token h2{font-size:40px;color:#2563eb}
.small{text-align:center;color:#64748b;margin-top:15px}
@media(max-width:600px){
  .container{margin:10px;padding:18px}
  .languages{grid-template-columns:1fr}
  .chat{height:400px}
  .controls{flex-direction:column}
  input{width:100%}
  button.action{width:100%}
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>QueueMitra</h1>
<p>Voice-first Smart Queue Assistant</p>
</header>

<!-- LANGUAGE SELECTION -->

<div id="languageScreen">

<h2>Choose Your Language</h2>
<p>Select a language to continue the complete conversation.</p>

<div class="languages">

<button class="langBtn" onclick="startApp('te')">
తెలుగు
<span>Telugu</span>
</button>

<button class="langBtn" onclick="startApp('en')">
English
<span>English</span>
</button>

<button class="langBtn" onclick="startApp('hi')">
हिन्दी
<span>Hindi</span>
</button>

</div>
</div>

<!-- CHAT SCREEN -->

<div id="chatScreen">

<div class="chat" id="chat"></div>

<div id="serviceArea" class="hidden">
<h3 id="serviceHeading"></h3>

<div class="services">
<div class="service" onclick="selectService('Hospital')">🏥 Hospital</div>
<div class="service" onclick="selectService('Bank')">🏦 Bank</div>
<div class="service" onclick="selectService('Government Office')">🏛️ Government Office</div>
<div class="service" onclick="selectService('Bus')">🚌 Bus</div>
<div class="service" onclick="selectService('Railway')">🚆 Railway</div>
<div class="service" onclick="selectService('Electricity')">💡 Electricity</div>
<div class="service" onclick="selectService('Municipal')">🏙️ Municipal</div>
<div class="service" onclick="selectService('Other Services')">📋 Other Services</div>
</div>
</div>

<div class="controls">
<input id="textInput" type="text" placeholder="Type your message here..." />
<button class="action send" onclick="sendText()">Send</button>
<button class="action speak" onclick="startListening()">🎤 Speak</button>
<button class="action reset" onclick="resetApp()">Reset</button>
</div>

<div class="status" id="status">Ready</div>

<div class="small" id="footerText"></div>

<div id="tokenArea"></div>

</div>
</div>

<script>

/* CONFIGURATION */

const WORKER_URL =
"https://plain-art-16cdqueuemitra-voice.shravyasrirachakonda.workers.dev";

let language = "en";
let languageCode = "en-IN";
let step = "service";
let service = "";
let place = "";
let purpose = "";
let listening = false;

const chat = document.getElementById("chat");
const textInput = document.getElementById("textInput");
const statusBox = document.getElementById("status");

/* LANGUAGE TEXT */

const translations = {

en:{
welcome:"Welcome to QueueMitra. Please select the service you need.",
service:"Please select a service.",
place:"Please tell me the place name.",
purpose:"What is your purpose for visiting?",
confirm:"Please confirm your details. Service: {service}. Place: {place}. Purpose: {purpose}. Say yes to confirm or no to change.",
change:"Okay. Please tell me the place name again.",
confirmed:"Your details are confirmed. Generating your token.",
token:"Your token number is {token}. Your estimated waiting time is {time} minutes. Thank you.",
serviceHeading:"Select a service",
footer:"Speak or type in English.",
yes:["yes","confirm","correct","okay","ok"],
no:["no","change","wrong"],
reset:"Conversation restarted. Please select a service."
},

te:{
welcome:"QueueMitra కు స్వాగతం. దయచేసి మీకు కావలసిన సేవను ఎంచుకోండి.",
service:"దయచేసి సేవను ఎంచుకోండి.",
place:"దయచేసి కార్యాలయం లేదా ప్రదేశం పేరు చెప్పండి.",
purpose:"మీరు ఏ పని కోసం వస్తున్నారు?",
confirm:"దయచేసి వివరాలను నిర్ధారించండి. సేవ: {service}. ప్రదేశం: {place}. కారణం: {purpose}. నిర్ధారించడానికి అవును అని చెప్పండి. మార్చడానికి కాదు అని చెప్పండి.",
change:"సరే. దయచేసి ప్రదేశం పేరు మళ్లీ చెప్పండి.",
confirmed:"మీ వివరాలు నిర్ధారించబడ్డాయి. మీ టోకెన్ తయారు చేస్తున్నాము.",
token:"మీ టోకెన్ నంబర్ {token}. మీ అంచనా వేచి ఉండే సమయం {time} నిమిషాలు. ధన్యవాదాలు.",
serviceHeading:"సేవను ఎంచుకోండి",
footer:"తెలుగులో మాట్లాడండి లేదా టైప్ చేయండి.",
yes:["అవును","సరే","నిర్ధారించండి","కరెక్ట్"],
no:["కాదు","మార్చండి","వద్దు"],
reset:"మళ్లీ ప్రారంభిద్దాం. దయచేసి సేవను ఎంచుకోండి."
},

hi:{
welcome:"QueueMitra में आपका स्वागत है। कृपया अपनी सेवा चुनें।",
service:"कृपया सेवा चुनें।",
place:"कृपया स्थान या कार्यालय का नाम बताएं।",
purpose:"आप किस काम से आ रहे हैं?",
confirm:"कृपया विवरण की पुष्टि करें। सेवा: {service}. स्थान: {place}. उद्देश्य: {purpose}. पुष्टि करने के लिए हाँ कहें और बदलने के लिए नहीं कहें।",
change:"ठीक है। कृपया स्थान का नाम फिर से बताएं।",
confirmed:"आपके विवरण की पुष्टि हो गई है। आपका टोकन बनाया जा रहा है।",
token:"आपका टोकन नंबर {token} है। अनुमानित प्रतीक्षा समय {time} मिनट है। धन्यवाद।",
serviceHeading:"सेवा चुनें",
footer:"हिंदी में बोलें या टाइप करें।",
yes:["हाँ","हां","सही","ठीक है","पुष्टि"],
no:["नहीं","बदलें"],
reset:"चलो फिर से शुरू करते हैं। कृपया सेवा चुनें।"
}
};

const serviceNames={
en:{
Hospital:"Hospital",
Bank:"Bank",
"Government Office":"Government Office",
Bus:"Bus",
Railway:"Railway",
Electricity:"Electricity",
Municipal:"Municipal",
"Other Services":"Other Services"
},
te:{
Hospital:"ఆసుపత్రి",
Bank:"బ్యాంకు",
"Government Office":"ప్రభుత్వ కార్యాలయం",
Bus:"బస్సు",
Railway:"రైల్వే",
Electricity:"విద్యుత్",
Municipal:"మున్సిపల్",
"Other Services":"ఇతర సేవలు"
},
hi:{
Hospital:"अस्पताल",
Bank:"बैंक",
"Government Office":"सरकारी कार्यालय",
Bus:"बस",
Railway:"रेलवे",
Electricity:"बिजली",
Municipal:"नगरपालिका",
"Other Services":"अन्य सेवाएं"
}
};

/* START */

function startApp(lang){

language=lang;

languageCode={
te:"te-IN",
en:"en-IN",
hi:"hi-IN"
}[lang];

document.getElementById("languageScreen").style.display="none";
document.getElementById("chatScreen").style.display="block";

document.getElementById("serviceHeading").textContent=
translations[language].serviceHeading;

document.getElementById("footerText").textContent=
translations[language].footer;

document.getElementById("serviceArea").classList.remove("hidden");

addBot(translations[language].welcome);

step="service";

}

/* CHAT */

function addUser(text){
addMessage(text,"user");
}

function addBot(text){
addMessage(text,"bot");
speak(text);
}

function addMessage(text,type){

const div=document.createElement("div");
div.className="message "+type;
div.textContent=text;

chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;

}

/* SPEECH OUTPUT VIA WORKER */

async function speak(text){

try{

statusBox.textContent="Speaking...";

const response=await fetch(WORKER_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
text:text,
language:language
})
});

if(!response.ok){
throw new Error("Speech API error");
}

const blob=await response.blob();
const audioURL=URL.createObjectURL(blob);
const audio=new Audio(audioURL);

audio.onended=()=>{
statusBox.textContent="Ready";
URL.revokeObjectURL(audioURL);
};

await audio.play();

}catch(error){

statusBox.textContent="Ready";

console.log("Speech error:",error);

}

}

/* SERVICE */

function selectService(value){

service=value;

document.querySelectorAll(".service").forEach(el=>{
el.classList.remove("selected");
});

event.currentTarget.classList.add("selected");

addUser(serviceNames[language][value]);

document.getElementById("serviceArea").classList.add("hidden");

step="place";

addBot(translations[language].place);

}

/* INPUT */

function sendText(){

const text=textInput.value.trim();

if(!text)return;

textInput.value="";

processText(text);

}

textInput.addEventListener("keydown",function(e){
if(e.key==="Enter"){
sendText();
}
});

/* PROCESS */

function processText(text){

addUser(text);

if(step==="service"){

service=text;
step="place";
document.getElementById("serviceArea").classList.add("hidden");
addBot(translations[language].place);
return;

}

if(step==="place"){

place=text;
step="purpose";
addBot(translations[language].purpose);
return;

}

if(step==="purpose"){

purpose=text;
step="confirm";

let message=translations[language].confirm
.replace("{service}",serviceNames[language][service]||service)
.replace("{place}",place)
.replace("{purpose}",purpose);

addBot(message);
return;

}

if(step==="confirm"){

const answer=text.toLowerCase().trim();
const yesList=translations[language].yes;
const noList=translations[language].no;

const isYes=yesList.some(word=>answer===word||answer.includes(word));
const isNo=noList.some(word=>answer===word||answer.includes(word));

if(isYes){

step="generating";
addBot(translations[language].confirmed);
generateToken();

}else if(isNo){

step="place";
addBot(translations[language].change);

}else{

addBot(translations[language].confirm
.replace("{service}",serviceNames[language][service]||service)
.replace("{place}",place)
.replace("{purpose}",purpose));

}

return;

}

if(step==="generating"){

addBot(translations[language].confirmed);
return;

}

}

/* TOKEN */

function generateToken(){

setTimeout(()=>{

const token=Math.floor(100+Math.random()*900);
const time=Math.floor(5+Math.random()*25);

const message=translations[language].token
.replace("{token}",token)
.replace("{time}",time);

addBot(message);

const area=document.getElementById("tokenArea");

area.innerHTML=`
<div class="token">
<h3>QueueMitra</h3>
<p>Token</p>
<h2>${token}</h2>
<p>${time} minutes estimated wait</p>
<button class="action send" onclick="window.print()">Print Token</button>
</div>
`;

step="done";

},1200);

}

/* VOICE INPUT */

function startListening(){

if(listening)return;

const SpeechRecognition=
window.SpeechRecognition||window.webkitSpeechRecognition;

if(!SpeechRecognition){

statusBox.textContent="Speech recognition not supported in this browser";
return;

}

const recognition=new SpeechRecognition();

recognition.lang=languageCode;
recognition.continuous=false;
recognition.interimResults=false;

recognition.onstart=()=>{
listening=true;
statusBox.textContent="Listening...";
};

recognition.onresult=(event)=>{

const text=event.results[0][0].transcript;

statusBox.textContent="Recognized";

processText(text);

};

recognition.onerror=(event)=>{
statusBox.textContent="Voice error: "+event.error;
};

recognition.onend=()=>{
listening=false;
if(statusBox.textContent==="Listening..."){
statusBox.textContent="Ready";
}
};

recognition.start();

}

/* RESET */

function resetApp(){

chat.innerHTML="";
document.getElementById("tokenArea").innerHTML="";
document.getElementById("serviceArea").classList.remove("hidden");

service="";
place="";
purpose="";
step="service";

document.querySelectorAll(".service").forEach(el=>{
el.classList.remove("selected");
});

addBot(translations[language].reset);

}

/* PRINT */

</script>
</body>
</html>
